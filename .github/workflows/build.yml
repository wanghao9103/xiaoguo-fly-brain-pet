name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2022
            architecture: x64
          - name: macos-arm64
            os: macos-14
            architecture: arm64
          - name: macos-x64
            os: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.0'
          architecture: ${{ matrix.architecture }}
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run regression tests
        run: python -m unittest discover -v
      - name: Build and verify standalone app
        run: python ci/build_release.py
      - name: Upload verified package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xiaoguo-${{ matrix.name }}
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ matrix.name }}
          path: release/verification-*.json
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish tagged version
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: xiaoguo-*
          path: release
          merge-multiple: true
      - name: Create or update release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "XiaoGuo $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release/*.zip release/*.sha256 --clobber
